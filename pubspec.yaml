name: plakao
description: Oto yikama icin sade plaka takip ve tek tusla bildirim uygulamasi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  camera: ^0.10.6
  image: ^4.2.0
  http: ^1.2.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  tflite_flutter: ^0.11.0
  flutter_local_notifications: ^18.0.1
  google_mlkit_text_recognition: ^0.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/models/Plate_detect_float32.tflite
    - assets/models/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true