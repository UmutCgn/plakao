workflows:
  ios-unsigned:
    name: Plakao iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketlerini indir
        script: flutter pub get
      - name: CocoaPods kurulumu
        script: |
          cd ios
          pod install
      - name: Imzasiz iOS derlemesi al
        script: flutter build ios --release --no-codesign
      - name: IPA paketini olustur
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Plakao.ipa Payload
    artifacts:
      - build/ios/ipa/Plakao.ipa