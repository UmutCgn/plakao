workflows:
  ios-unsigned:
    name: Plakao iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Git LFS dosyalarini cek ve dogrula
        script: |
          git lfs install
          git lfs pull
          ls -lh assets/models/Plate_detect_float32.tflite
      - name: Flutter paketlerini indir
        script: flutter pub get
      - name: CocoaPods kurulumu
        script: |
          cd ios
          pod install --repo-update
      - name: Imzasiz iOS derlemesi al
        script: |
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: IPA paketini olustur
        script: |
          APP_PATH=$(find build/ios_derived/Build/Products/Release-iphoneos -name "Runner.app" -maxdepth 1 | head -n 1)
          echo "Found Runner.app at: $APP_PATH"
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Plakao.ipa Payload
    artifacts:
      - build/ios/ipa/Plakao.ipa